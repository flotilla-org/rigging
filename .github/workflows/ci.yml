name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No project dependencies
        run: python3 ci/no_project_deps.py
      # rigging-ssh's contract tests start a disposable loopback sshd.
      - name: Install SSH test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server
          sudo mkdir -p /run/sshd
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Compile gate for the non-Unix paths (sysinfo, Windows volume APIs, the
  # child-kill branch); the process scenarios themselves run on Linux.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Compile Windows implementations and tests
        run: cargo check --workspace --all-targets --locked
