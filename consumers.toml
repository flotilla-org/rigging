# Projects that depend on rigging, and the revision each one pins.
#
# Each consumer names rigging once, in its workspace Cargo.toml
# [workspace.dependencies], with a single `rev`; its crates use `workspace = true`.
# Update the entry here in the same change that bumps a consumer's pin.
#
# [[consumer]]
# repo = "flotilla-org/flotilla"
# rev = "<commit>"
# crates = ["flotilla-cbor"]

[[consumer]]
repo = "flotilla-org/drydock"
rev = "9c553b12c9922ade32ef66185884be2114c1981b"
crates = ["rigging-http-serve", "rigging-tls", "rigging-http-client", "rigging-replay-testkit"]

[[consumer]]
repo = "flotilla-org/flotilla"
rev = "bf71f7d840b14e50dd12e7bfc58e2654f51692c2"
crates = ["rigging-tls", "rigging-process", "rigging-http-client", "rigging-replay-testkit"]
