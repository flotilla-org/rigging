[package]
name = "flotilla-cbor"
version = "0.1.0"
edition = "2021"
repository.workspace = true
license.workspace = true
description = "The stack CBOR profile of ADR 0063: deterministic writers, safe readers, limits and framing"

# Lives in rigging, so it depends on no project crate; projects take it as a git
# dependency pinned once per workspace.
[dependencies]
# Pinned exactly: the conformance corpus pins its behaviour, and an upgrade is a
# deliberate change that reruns the corpus.
cbor2 = { version = "=1.1.6", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# Declared directly rather than through the workspace, on purpose.
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
